<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChemTrain Ranking</title>
<meta name="description" content="The ChemTrain Daily ranking: today, this week, this month and all time, for everyone or for your group of friends. Pick a pseudo and your scores and progress follow you to every device.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EDF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1318" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChemTrain">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chemtrain.github.io/ranking/">
<meta property="og:title" content="ChemTrain Ranking">
<meta property="og:description" content="Who rode furthest today? The Daily quiz ranking, for everyone or for your group.">
<meta property="og:image" content="https://chemtrain.github.io/icons/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a landing page. Header; a hero with today's Daily and the logo tile (the loading screen's train flies into
   it); the rail line, one station per app, with a train that rides down as you scroll; the install-and-offline panel;
   the footer. Same tokens and fonts as the apps. */
:root {
  --logo-tile: #FFFFFF; --bg: #EDF1F4; --surface: #FFFFFF; --paper: #F6F8FA; --ink: #15212B; --muted: #566472; --line: #D3DBE2;
  --accent: #0D5C78; --accent-ink: #FFFFFF; --accent-soft: #DAEAF1; --good: #1B7548; --good-soft: #DCF0E4;
  --rail: #9AA8B4; --sleeper: #C9D2DA; --shadow: rgb(21 33 43 / .28); --halo: transparent;
  --a-pka: #2a78d6; --a-rxn: #eb6834; --a-pg: #1baf7a; --a-tmc: #6250d6; --a-rl: #e34948; --a-pr: #0f94a8; --a-rad: #d99a00; --a-beast: #15212B;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rainbow: linear-gradient(90deg, var(--a-rl), var(--a-rxn), var(--a-rad), var(--a-pg), var(--a-pr), var(--a-pka), var(--a-tmc));
  --rainbow-v: linear-gradient(180deg, var(--a-rl), var(--a-rxn), var(--a-rad), var(--a-pg), var(--a-pr), var(--a-pka), var(--a-tmc));
  --rainbow-c: conic-gradient(var(--a-rl), var(--a-rxn), var(--a-rad), var(--a-pg), var(--a-pr), var(--a-pka), var(--a-tmc), var(--a-rl));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --logo-tile: #E6ECF0; --bg: #0D1318; --surface: #151D24; --paper: #10171D; --ink: #E4EBF0; --muted: #94A3B0; --line: #27333D;
    --accent: #5DB7D5; --accent-ink: #08212B; --accent-soft: #173341; --good: #5FC88F; --good-soft: #143224;
    --rail: #5B6B78; --sleeper: #2C3943; --shadow: rgb(0 0 0 / .55); --halo: rgb(230 236 240 / .2);
    --a-pka: #3987e5; --a-rxn: #d95926; --a-pg: #199e70; --a-tmc: #9085e9; --a-rl: #e66767; --a-pr: #1f9fb3; --a-rad: #c98500; --a-beast: #E4EBF0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --logo-tile: #E6ECF0; --bg: #0D1318; --surface: #151D24; --paper: #10171D; --ink: #E4EBF0; --muted: #94A3B0; --line: #27333D;
  --accent: #5DB7D5; --accent-ink: #08212B; --accent-soft: #173341; --good: #5FC88F; --good-soft: #143224;
  --rail: #5B6B78; --sleeper: #2C3943; --shadow: rgb(0 0 0 / .55); --halo: rgb(230 236 240 / .2);
  --a-pka: #3987e5; --a-rxn: #d95926; --a-pg: #199e70; --a-tmc: #9085e9; --a-rl: #e66767; --a-pr: #1f9fb3; --a-rad: #c98500; --a-beast: #E4EBF0;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--f-body); overflow-x: hidden; }
@supports (overflow: clip) { body { overflow-x: clip; } }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button { font: inherit; color: inherit; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; border-radius: 14px; }
.logo-tile { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: var(--logo-tile); border: 1px solid var(--line); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
.brand:hover .logo-tile { transform: rotate(-6deg) scale(1.06); }
.logo-tile .logo { width: 27px; height: 38px; }
.wordmark { font: 700 24px/1 var(--f-display); letter-spacing: -.01em; }
.toplinks { display: flex; align-items: center; gap: 4px; }
.toplinks a, .toplinks button { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 10px; border: 0; background: none; cursor: pointer; white-space: nowrap; }
.toplinks a:hover, .toplinks button:hover { color: var(--ink); background: var(--surface); }
.toplinks .chip { background: var(--accent); color: var(--accent-ink); }
.toplinks .chip:hover { background: var(--accent); color: var(--accent-ink); filter: brightness(1.1); }
.toplinks .chip.acct { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); max-width: 11em; overflow: hidden; text-overflow: ellipsis; }
.toplinks .chip.acct:hover { background: var(--surface); color: var(--ink); filter: none; box-shadow: inset 0 0 0 1.5px var(--accent); }
.toplinks .chip.acct.in::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--good); transform: translateY(-1px); }
.netchip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }
@media (max-width: 600px) { .toplinks .wide { display: none; } .wordmark { font-size: 21px; } }
.standalone .toplinks .install-link { display: none; }

/* ---------- hero ---------- */
.hero { display: grid; gap: 22px; align-items: center; padding: 20px 0 40px; }
@media (min-width: 880px) { .hero { grid-template-columns: minmax(0, 1fr) 380px; gap: 56px; padding: 52px 0 76px; } }
h1 { margin: 0; font: 700 clamp(40px, 7.4vw, 66px)/1.0 var(--f-display); letter-spacing: -.025em; }
h1 .soft { display: block; color: var(--muted); font-weight: 500; }
.lede { margin: 18px 0 0; font-size: 18px; color: var(--muted); max-width: 33em; }
.hero-art { position: relative; display: grid; place-items: center; min-height: 190px; }
@media (max-width: 879px) { .hero-art { order: -1; min-height: 176px; } }
@media (min-width: 880px) { .hero-art { min-height: 420px; } }
.hero-tile { position: relative; z-index: 1; padding: 17px 20px; }  /* the loader tile's proportions, so the flight lands without a jump */
.hero-tile img { display: block; width: 100px; height: auto; filter: drop-shadow(0 16px 18px var(--shadow)); }
@media (min-width: 880px) { .hero-tile { padding: 34px 40px; } .hero-tile img { width: 200px; } }
.hero-tile::before, #ct-loading .ct-tile::before { content: ""; position: absolute; inset: -4%; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, var(--halo), transparent); }
.float { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); color: var(--c); opacity: 0; transition: opacity 1.2s ease; }
.float svg { display: block; width: 100%; height: 100%; animation: drift var(--d) ease-in-out infinite alternate; }
.ready .float { opacity: .7; }
html:not(.js) .float { opacity: .7; }
@keyframes drift { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }

/* today's quiz */
.today { position: relative; overflow: hidden; margin-top: 28px; padding: 20px 20px 18px; max-width: 580px; display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 16px 40px -30px var(--shadow); }
.today::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--rainbow); background-size: 200% 100%; animation: slide 8s linear infinite; }
@keyframes slide { to { background-position: 200% 0; } }
.today-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.today-top b { font: 700 20px/1.2 var(--f-display); }
.today-date { color: var(--muted); font-size: 14px; }
.today-status { margin: 0; }
.today-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.streak { margin-left: auto; display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: 14px; }
.streak b { font: 700 24px/1 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 12px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; cursor: pointer; transition: transform .15s ease, box-shadow .2s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -10px var(--accent); }
.btn:active { transform: translateY(0); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
.btn:hover svg { transform: translateX(3px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); box-shadow: none; }

/* hero entrance, after the loading screen */
.js.loading .hero-tile { visibility: hidden; }
.js .hero-text > * { opacity: 0; transform: translateY(14px); }
.ready .hero-text > * { opacity: 1; transform: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
.ready .hero-text > :nth-child(2) { transition-delay: .08s; } .ready .hero-text > :nth-child(3) { transition-delay: .16s; } .ready .hero-text > :nth-child(4) { transition-delay: .24s; }

/* ---------- the line ---------- */
.line { padding: 28px 0 24px; }
.line-head { max-width: 760px; margin: 0 auto 26px; }
h2 { margin: 0; font: 700 clamp(28px, 4.6vw, 42px)/1.06 var(--f-display); letter-spacing: -.02em; }
.section-lede { margin: 12px 0 0; color: var(--muted); max-width: 36em; }
.rail-wrap { position: relative; max-width: 760px; margin: 0 auto; --rx: 24px; --gap: 64px; }
@media (min-width: 640px) { .rail-wrap { --rx: 36px; --gap: 88px; } }
.rail { position: absolute; left: calc(var(--rx) - 8px); width: 16px; top: 0; height: 0; background: repeating-linear-gradient(180deg, var(--sleeper) 0 3px, transparent 3px 11px); }
.rail::before, .rail::after { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--rail); border-radius: 1px; }
.rail::before { left: 2px; } .rail::after { right: 2px; }
.rail-fill { position: absolute; left: 5px; width: 6px; top: 0; height: 0; border-radius: 3px; background: var(--rainbow-v); opacity: .9; }
.js .rail { transform: scaleY(0); transform-origin: top; transition: transform 1.2s cubic-bezier(.4,0,.2,1); }
.js .line.in .rail { transform: none; }
.stations { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.station { position: relative; padding-left: var(--gap); --a: var(--accent); }
.s-beast { --a: var(--a-beast); } .s-rxn { --a: var(--a-rxn); } .s-pka { --a: var(--a-pka); } .s-pg { --a: var(--a-pg); } .s-tmc { --a: var(--a-tmc); }
.s-rad { --a: var(--a-rad); } .s-pr { --a: var(--a-pr); } .s-rl { --a: var(--a-rl); }
.stop { position: absolute; left: calc(var(--rx) - 12px); top: 28px; z-index: 2; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 5px solid var(--a); transition: background .3s ease, transform .3s cubic-bezier(.3,1.6,.5,1); }
.s-daily .stop { border-color: transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--rainbow-c) border-box; }
.station.lit .stop { background: var(--a); transform: scale(1.18); }
.s-daily.lit .stop { background: var(--rainbow-c) border-box; }
.station.lit .stop::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--a); opacity: 0; animation: ping .9s ease-out; }
.s-daily.lit .stop::after { border-color: var(--a-rxn); }
@keyframes ping { from { transform: scale(.5); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
.st-card { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 16px 16px 16px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: var(--ink); text-decoration: none; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
.st-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--a); }
.s-daily .st-card::before { background: var(--rainbow-v); }
.st-card:hover { transform: translateX(5px); border-color: color-mix(in srgb, var(--a) 55%, var(--line)); box-shadow: 0 14px 30px -22px var(--shadow); }
.st-body { display: grid; gap: 3px; min-width: 0; }
.st-kicker { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.st-name { font: 700 22px/1.15 var(--f-display); letter-spacing: -.01em; }
.st-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; vertical-align: 3px; font: 600 12px/1.5 var(--f-mono); letter-spacing: 0; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.st-about { color: var(--muted); font-size: 15px; }
.st-prog { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.st-prog b { color: var(--ink); }
.bar { display: flex; flex: 1 1 120px; max-width: 220px; height: 7px; overflow: hidden; border-radius: 4px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.bar i { height: 100%; width: 0; transition: width 1.1s cubic-bezier(.2,.7,.2,1) .25s; }
.bar .m { background: var(--a); }
.bar .l { background: color-mix(in srgb, var(--a) 35%, transparent); }
.st-go { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--paper); color: var(--ink); transition: background .25s ease, color .25s ease, transform .25s ease; }
.st-go svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.st-card:hover .st-go { background: var(--a); color: var(--surface); transform: translateX(2px); }
.s-daily .st-card:hover .st-go { background: var(--accent); color: var(--accent-ink); }
.js .station { opacity: 0; transform: translateX(28px); transition: opacity .55s ease, transform .55s cubic-bezier(.2,.7,.2,1); }
.js .station.in { opacity: 1; transform: none; }
.train { position: absolute; left: calc(var(--rx) - 17px); top: -36px; z-index: 3; width: 34px; height: 72px; pointer-events: none; will-change: transform; opacity: 0; transition: opacity .4s ease; }
.line.in .train { opacity: 1; }
.train .loco { display: block; width: 100%; height: 100%; overflow: visible; transition: transform .5s cubic-bezier(.4,0,.2,1); filter: drop-shadow(0 4px 5px var(--shadow)); }
.train.up .loco { transform: rotate(180deg); }
.train.moving .body { animation: chug .12s linear infinite alternate; }
@keyframes chug { from { transform: translateX(-.4px); } to { transform: translateX(.4px); } }
.puff { position: absolute; z-index: 4; pointer-events: none; animation: puff 1.6s ease-out forwards; }
.puff svg { display: block; width: 100%; height: 100%; }
@keyframes puff { from { opacity: .95; transform: scale(.35) rotate(0deg); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.7) rotate(var(--r)); } }
.line-end { max-width: 760px; margin: 18px auto 0; padding-left: var(--gap); color: var(--muted); font-size: 14px; }
@media (min-width: 1000px) {
  .line { display: grid; grid-template-columns: 300px minmax(0, 1fr); column-gap: 56px; align-items: start; }
  .line-head { grid-row: 1 / span 2; position: sticky; top: 40px; margin: 0; }
  .rail-wrap, .line-end { grid-column: 2; max-width: 800px; margin-left: 0; }
}
.rail-wrap + .line-end { --gap: 64px; }
@media (min-width: 640px) { .rail-wrap + .line-end { --gap: 88px; } }

/* ---------- install ---------- */
.install { margin: 56px auto 0; max-width: 1000px; padding: clamp(20px, 4vw, 40px); display: grid; gap: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; scroll-margin-top: 16px; }
@media (min-width: 880px) { .install { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; } }
.install p { margin: 12px 0 0; color: var(--muted); }
.perks { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.perks li { display: flex; gap: 10px; align-items: baseline; }
.perks li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--rainbow-c); transform: translateY(-1px); }
.how { display: grid; gap: 16px; align-content: start; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; width: fit-content; max-width: 100%; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 400px) { .tabs button { padding: 7px 10px; } }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 700 14px/1 var(--f-display); transform: translateY(-4px); }
.ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.panel-p[hidden] { display: none; }
.panel-p { display: grid; gap: 14px; animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.offline { display: grid; gap: 10px; padding: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
.offline h3 { margin: 0; font: 700 17px/1.2 var(--f-display); display: flex; align-items: center; gap: 8px; }
.offline p { margin: 0; font-size: 14px; }
.offline .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.offline .btn { padding: 8px 14px; font-size: 14px; }
.dl { height: 8px; border-radius: 4px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.dl i { display: block; height: 100%; width: 0; background: var(--rainbow); transition: width .4s ease; }
.ok-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 4px var(--good-soft); }
.installed-msg { display: none; }
.standalone .installed-msg { display: block; }
.standalone .how-browser { display: none; }

/* ---------- footer ---------- */
.foot { margin-top: 56px; padding: 26px 0 max(32px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; display: grid; gap: 6px; }
.foot p { margin: 0; }
.foot .credits { color: var(--ink); font-weight: 600; font-size: 15px; }

/* ---------- ranking ---------- */
.rank { margin: 56px auto 0; max-width: 1000px; padding: clamp(20px, 4vw, 40px); display: grid; gap: 26px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; scroll-margin-top: 16px; }
@media (min-width: 880px) { .rank { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; } }
.rank p { margin: 12px 0 0; color: var(--muted); }
.rank .row { margin-top: 22px; }
.rank-mini { padding: 16px 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; }
.rank-mini p { margin: 0; }
.rank-mini .ct-foot { margin-top: 10px; }

/* ---------- loading screen ---------- */

#ct-loading .ct-cap { font: 700 22px/1 var(--f-display); letter-spacing: -.01em; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .45; } }
#ct-loading.ct-done { opacity: 0; transition: opacity .35s ease; }
html:not(.js) #ct-loading { display: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  .js .station, .js .hero-text > * { opacity: 1; transform: none; }
  .js .rail { transform: none; }
}

<script>
(function () {
/* How a ChemTrain account's saved data merges across devices. Shared by the pages (inlined by shared/frame.py,
   which drops the export line) and the server (net/src/worker.js imports it).

   A synced document maps a localStorage key to { v: its value, t: when that device last changed it }. */

// What to do with a key: skip it, keep the newer value (lww), keep the higher number per entry (max), keep every
// entry (union), or keep the play with more answers (progress).
function KIND(k) {
  if (!/^(pka2|rxn|pg|tmc1|rl|rad|pr|ctd)\./.test(k)) return 'skip';                    // not an app's record
  if (/\.round\.|\.pt$|^ctd\.past\.|^ctd\.set$/.test(k)) return 'skip';                 // a round or set under way, an open panel
  if (/^ctd\.daily\./.test(k)) return 'progress';                                        // a Daily quiz: its questions and answers
  if (/\.levels(\.|$)|\.seen$|^(ctd\.history|ctd\.late|ctd\.beast|pg\.plan|pg\.removed|rxn\.which|pka2\.acidic|tmc1\.named)$/.test(k)) return 'max';
  if (/\.stars$/.test(k)) return 'union';                                                // starred cards
  return 'lww';                                                                          // settings, picks, custom cards
}

const isObj = v => v && typeof v === 'object' && !Array.isArray(v);

// one key: the record kept when `a` (what is stored) meets `b` (what arrives)
function mergeRec(kind, a, b) {
  if (!a) return b;
  if (!b) return a;
  const newer = (b.t || 0) >= (a.t || 0) ? b : a, older = newer === b ? a : b, t = Math.max(a.t || 0, b.t || 0);
  if (kind === 'max' && isObj(a.v) && isObj(b.v)) {
    const v = { ...older.v, ...newer.v };
    for (const k of Object.keys(v)) {
      const x = a.v[k], y = b.v[k];
      if (typeof x === 'number' && typeof y === 'number') v[k] = Math.max(x, y);
    }
    return { v, t };
  }
  if (kind === 'union') {
    if (Array.isArray(a.v) && Array.isArray(b.v)) return { v: [...new Set([...a.v, ...b.v])], t };
    if (isObj(a.v) && isObj(b.v)) return { v: { ...older.v, ...newer.v }, t };
  }
  if (kind === 'progress' && isObj(a.v) && isObj(b.v)) {
    const na = Array.isArray(a.v.answers) ? a.v.answers.length : 0, nb = Array.isArray(b.v.answers) ? b.v.answers.length : 0;
    return na === nb ? { v: newer.v, t } : na > nb ? { v: a.v, t } : { v: b.v, t };
  }
  return { v: newer.v, t };
}

// the stored document after `changes` from a device
function mergeDocs(doc, changes) {
  const out = { ...doc };
  for (const [k, rec] of Object.entries(changes || {})) {
    const kind = KIND(k);
    if (kind === 'skip' || !rec || !('v' in rec)) continue;
    out[k] = mergeRec(kind, out[k], { v: rec.v, t: Number(rec.t) || 0 });
  }
  return out;
}



/* ChemTrain's account on this device, and its progress kept in step across devices. Inlined into every ChemTrain
   page by shared/frame.py, right after sync_rules.js (which gives KIND), before the page's own script.

   An account is { id, key, pseudo } under localStorage 'ct.account'. Without one, nothing here does anything.
   With one, the page's saved records (see KIND) go to the server and the other devices' changes come back:
   at load, when the page is hidden, when the connection returns, and every minute while something changed.
   The server merges (shared/sync_rules.js) and answers with the whole document, which is written back here.
   A change that arrives after the page has started, before anything was touched, reloads it once. */
(function () {
  'use strict';
  const DEFAULT_API = 'https://api.chemtrain.workers.dev';
  const json = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
  const save = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const API = json('ct.api') || DEFAULT_API;
  const account = () => json('ct.account');

  async function api(path, body, opts) {
    const init = body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), ...opts } : { method: 'GET' };
    const r = await fetch(API + path, init);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d.error || 'HTTP ' + r.status), { status: r.status, code: d.error || 'http_' + r.status });
    return d;
  }
  const authed = (path, body, opts) => { const a = account(); return a ? api(path, { key: a.key, ...body }, opts) : Promise.reject(Object.assign(new Error('no account'), { code: 'no_account' })); };

  /* ---------- progress across devices ---------- */
  const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return h.toString(36); };
  function keysToSync() {
    const cut = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10), out = [];  // Daily quizzes: the last 60 days
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i), kind = KIND(k);
      if (kind === 'skip' || (kind === 'progress' && k.slice('ctd.daily.'.length) < cut)) continue;
      out.push(k);
    }
    return out;
  }
  function localChanges() {
    const snap = json('ct.sync.snap') || {}, changes = {}, now = Date.now();
    for (const k of keysToSync()) {
      const raw = localStorage.getItem(k);
      if (raw == null || snap[k] === hash(raw)) continue;
      try { changes[k] = { v: JSON.parse(raw), t: now }; } catch (e) {}
    }
    return changes;
  }

<script>
/* The ranking: boards for today, this week, this month and all time, for everyone or for a group of friends, and
   the account card (pseudo, the code for another device, groups). Shown by ChemTrain Daily (its Ranking tab) and the
   home page; inlined after net.js by shared/frame.py, with rank.css.

   CT.rankUI({ main, side, day }) renders the board into `main` and the account card into `side` (or above the
   board when there is no side). Calling it again re-renders and refreshes. An invite link ends in #group=CODE. */
(function () {
  'use strict';
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const json = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const HOME = 'https://chemtrain.github.io/';
  const PERIODS = [['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['all', 'All time']];
  const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const MSG = {
    pseudo_taken: 'That pseudo is taken; try another.', bad_pseudo: 'A pseudo is 2 to 20 letters, digits, spaces, _ . \' or -, and stays polite.',
    bad_key: 'A code has 16 letters and digits, like XXXX-XXXX-XXXX-XXXX.', no_user: 'No pseudo has this code. Check it and try again.',
    no_group: 'No group has this code.', group_full: 'That group is full.', bad_name: 'A group name is 2 to 30 characters.',
    too_many_groups: 'You already run ten groups.', not_owner: 'Only the group\'s owner can do that.', no_account: 'Pick a pseudo first.',
  };
  const why = e => MSG[e && e.code] || (e && e.status ? 'The ranking server is not answering. Try again later.'
    : window.top !== window ? 'The ranking cannot be reached from inside this frame. Open ChemTrain at chemtrain.github.io.' : 'You seem to be offline. Try again when you are back online.');

  const S = { main: null, side: null, day: null, period: 'today', scope: 'all', groups: null, boards: {}, invite: null, busy: false };
  const view = json('ct.rank.view'); if (view) { S.period = view.period || 'today'; S.scope = view.scope || 'all'; }

  function inviteFromHash() {
    const m = /[#&]group=([0-9A-Za-z]{6})\b/.exec(location.hash);
    return m ? m[1].toUpperCase() : null;
  }

  /* ---------- the account card ---------- */
  function accountHTML() {
    const a = CT.account();
    if (!a) return `<div class="ct-card">
      <p class="eyebrow">Join the ranking</p>
      ${S.invite ? `<div class="ct-invite">You are invited to <b>${esc(S.invite.name)}</b>${S.invite.n ? ` (${plural(S.invite.n, 'member')})` : ''}. Pick a pseudo and you are in.</div>` : ''}
      <p class="ct-p">Pick a pseudo: your Daily scores join the boards, and your progress in every app follows you to your other devices. No account, no email.</p>
      <form class="ct-form" data-form="join"><input class="ct-in" name="pseudo" maxlength="20" placeholder="Your pseudo" autocomplete="nickname" required><button type="submit" class="btn">Join</button>
        <label class="ct-check"><input type="checkbox" name="public" checked> Show me on the public ranking <small>(off: only your groups see your scores)</small></label></form>
      <details class="ct-more"><summary>I already have a code</summary>
        <p class="ct-p">The code is under "Use ChemTrain on another device" where you first joined.</p>
        <form class="ct-form" data-form="login"><input class="ct-in mono" name="key" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" required><button type="submit" class="btn ghost">Link this device</button></form></details>
      <p class="ct-msg" role="status" aria-live="polite"></p></div>`;
    const groups = S.groups || [];
    const invite = S.invite && !groups.some(g => g.code === S.invite.code)
      ? `<div class="ct-invite">You are invited to <b>${esc(S.invite.name)}</b>${S.invite.n ? ` (${plural(S.invite.n, 'member')})` : ''}.<div class="ct-row"><button type="button" class="btn small" data-act="accept">Join ${esc(S.invite.name)}</button><button type="button" class="ct-link" data-act="dismiss">No thanks</button></div></div>` : '';
    return `<div class="ct-card">
      <p class="eyebrow">You</p>
      <p class="ct-who"><b>${esc(a.pseudo)}</b><button type="button" class="ct-link" data-act="rename">change</button></p>
      <label class="ct-check"><input type="checkbox" data-act="public"${a.public === 0 ? '' : ' checked'}> Show me on the public ranking <small>${a.public === 0 ? '(off: only your groups see your scores)' : ''}</small></label>
      ${invite}
      <details class="ct-more"><summary>Use ChemTrain on another device</summary>
        <p class="ct-p">On the other device, open the ranking, choose "I already have a code" and type this one. Your scores and progress then follow you. It is the only key to your pseudo, so keep it somewhere safe.</p>
        <pre class="ct-code">${esc(a.key)}</pre>
        <div class="ct-row"><button type="button" class="btn ghost small" data-act="copy-code">Copy the code</button><span class="ct-msg" data-msg="code"></span></div></details>
      <p class="eyebrow">Groups</p>
      ${groups.length ? `<ul class="ct-groups">${groups.map(g => `<li><span><b>${esc(g.name)}</b><small>${plural(g.n, 'member')} · code ${esc(g.code)}</small></span>
        <span class="ct-row"><button type="button" class="ct-link" data-act="invite" data-code="${esc(g.code)}">Invite link</button>${g.mine ? `<button type="button" class="ct-link" data-act="members" data-code="${esc(g.code)}">Members</button>` : ''}<button type="button" class="ct-link" data-act="leave" data-code="${esc(g.code)}" data-name="${esc(g.name)}">${g.mine ? 'Close' : 'Leave'}</button></span>
        <div class="ct-members" data-members="${esc(g.code)}" hidden></div></li>`).join('')}</ul>`
        : '<p class="ct-p">Race your friends or your class: make a group and share its link, or join one with its code.</p>'}
      <form class="ct-form" data-form="group"><input class="ct-in" name="name" maxlength="30" placeholder="A name for your group" required><button type="submit" class="btn ghost small">Create</button></form>
      <form class="ct-form" data-form="joingroup"><input class="ct-in mono" name="code" maxlength="7" placeholder="Group code" autocomplete="off" spellcheck="false" required><button type="submit" class="btn ghost small">Join</button></form>
      <p class="ct-msg" role="status" aria-live="polite"></p>
      <p class="ct-fine"><button type="button" class="ct-link" data-act="logout">Sign out on this device</button> · <button type="button" class="ct-link danger" data-act="delete">Delete my pseudo and scores</button></p></div>`;
  }

  /* ---------- the board ---------- */
  // a booklet: one tab for everyone and one per group, the periods inside
  function barHTML() {
    const groups = S.groups || [];
    if (S.scope !== 'all' && !groups.some(g => g.code === S.scope)) S.scope = 'all';
    const book = (v, l) => `<button type="button" role="tab" aria-selected="${v === S.scope}" data-scope="${esc(v)}" title="${esc(l)}">${esc(l)}</button>`;
    return `<div class="ct-books" role="tablist" aria-label="Who">${book('all', 'Everyone')}${groups.map(g => book(g.code, g.name)).join('')}
        ${CT.account() ? '<button type="button" class="ct-addbook" data-act="newgroup" title="Make a group for your friends or your class">+ Group</button>' : ''}</div>
      <div class="ct-book"><div class="tabs ct-tabs" role="tablist" aria-label="Period">${PERIODS.map(([k, l]) => `<button type="button" role="tab" aria-selected="${k === S.period}" data-period="${k}">${l}</button>`).join('')}</div>
      <div class="ct-boardwrap" aria-live="polite"></div></div>`;
  }
  // the home page's glimpse: today's top five and your place
  async function miniBoard(el, o) {
    const a = CT.account();
    const render = (b, err) => {
      if (!b) { el.innerHTML = `<p class="ct-empty">${esc(why(err))}</p>`; return; }
      const rows = b.rows.slice(0, 5).map(r => `<tr${r.me ? ' class="me"' : ''}><td class="rk">${r.rank <= 3 ? `<b class="m m${r.rank}">${r.rank}</b>` : r.rank}</td><td>${esc(r.pseudo)}${r.me ? ' <small>(you)</small>' : ''}</td><td class="num">${r.points}<small> / ${r.total}</small></td></tr>`).join('');
      const you = b.me ? `You are <b>${ordinal(b.me.rank)}</b> today.` : a ? 'No score of yours today yet.' : '';
      el.innerHTML = `<p class="eyebrow">Today</p>${b.rows.length ? `<table class="ct-board ct-mini"><tbody>${rows}</tbody></table>` : '<p class="ct-empty">Nobody has a score today yet. Be the first.</p>'}
        <p class="ct-foot">${plural(b.n, 'player')} today. ${you}</p>`;
    };
    el.innerHTML = '<p class="ct-empty">Loading today\'s ranking…</p>';
    try { render(await CT.api(`/board?period=today&day=${o.day}${a ? '&me=' + encodeURIComponent(a.id) : ''}`)); } catch (e) { render(null, e); }
  }
  function boardHTML(b) {
    const a = CT.account(), today = S.period === 'today';
    const pts = r => today ? `${r.points}<small> / ${r.total}</small>` : String(r.points);
    const medal = r => r.rank <= 3 ? `<b class="m m${r.rank}">${r.rank}</b>` : r.rank;  // gold, silver, bronze: no emoji, so every device shows them
    const row = r => `<tr${r.me ? ' class="me"' : ''}><td class="rk">${medal(r)}</td><td>${esc(r.pseudo)}${r.me ? ' <small>(you)</small>' : ''}</td><td class="num">${pts(r)}</td>${today ? '' : `<td class="num">${r.days}</td>`}</tr>`;
    let rows = b.rows.map(row).join('');
    if (b.me && !b.me.hidden && !b.rows.some(r => r.me)) rows += `<tr class="gap"><td colspan="${today ? 3 : 4}">…</td></tr>` + row({ ...b.me, pseudo: a ? a.pseudo : 'you', me: true });
    const scopeName = S.scope === 'all' ? '' : ' in ' + esc((S.groups.find(g => g.code === S.scope) || {}).name || 'this group');
    const when = { today: 'today', week: 'this week', month: 'this month', all: 'so far' }[S.period];
    if (!b.rows.length) return `<p class="ct-empty">${S.scope === 'all' ? `Nobody has a score ${when} yet. ` : `Nobody in this group has a score ${when} yet. `}${a ? 'Play today\'s quiz to be the first.' : 'Pick a pseudo and play today\'s quiz to be the first.'}</p>`;
    const you = b.me && b.me.hidden ? `You are hidden from this board (you would be <b>${ordinal(b.me.rank)}</b>).`
      : b.me ? `You are <b>${ordinal(b.me.rank)}</b>${scopeName}.` : a ? `No score of yours ${when}${scopeName}.` : '';
    return `<table class="ct-board"><thead><tr><th class="rk">#</th><th>Pseudo</th><th class="num">${today ? 'Score' : 'Points'}</th>${today ? '' : '<th class="num">Days</th>'}</tr></thead><tbody>${rows}</tbody></table>
      <p class="ct-foot">${plural(b.n, 'player')} ${when}${scopeName}. ${you}</p>`;
  }
  async function loadBoard() {
    const wrap = S.main.querySelector('.ct-boardwrap');
    if (!wrap) return;
    const a = CT.account(), key = `${S.period}|${S.scope}|${S.day}`;
    if (S.boards[key]) wrap.innerHTML = boardHTML(S.boards[key]); else wrap.innerHTML = '<p class="ct-empty">Loading the ranking…</p>';
    try {
      const b = await CT.api(`/board?period=${S.period}&day=${S.day}${S.scope !== 'all' ? '&group=' + S.scope : ''}${a ? '&me=' + encodeURIComponent(a.id) : ''}`);
      S.boards[key] = b;
      if (S.main.querySelector('.ct-boardwrap') === wrap) wrap.innerHTML = boardHTML(b);
    } catch (e) {
      if (!S.boards[key]) wrap.innerHTML = `<p class="ct-empty">${esc(why(e))}</p>`;
    }
  }

  /* ---------- rendering ---------- */
  function sideEl() { return S.side || S.main.querySelector('.ct-account'); }
  function renderAccount() { const el = sideEl(); if (el) el.innerHTML = accountHTML(); if (CT.acctButtons) CT.acctButtons(); }
  function render() {
    S.main.innerHTML = (S.side ? '' : '<div class="ct-account"></div>') + barHTML();
    renderAccount();
    loadBoard();
  }
  async function refreshGroups() {
    if (!CT.account()) { S.groups = []; return; }
    try { const me = await CT.authed('/me', {}); S.groups = me.groups || []; if (me.pseudo !== CT.account().pseudo || me.public !== CT.account().public) save('ct.account', { ...CT.account(), pseudo: me.pseudo, public: me.public }); }
    catch (e) { if (e.code === 'no_user') { CT.logout(); S.groups = []; } else if (!S.groups) S.groups = []; }
  }
  const msgEl = (el, name) => name ? el.querySelector(`[data-msg="${name}"]`) : el.querySelector('.ct-msg:not([data-msg])');
  function say(el, text, err) { const m = msgEl(el); if (m) { m.textContent = text; m.classList.toggle('err', !!err); } }
  function copy(text, el, name) {
    const done = () => { const m = msgEl(el, name); if (m) { m.textContent = 'Copied.'; m.classList.remove('err'); } };
    try { navigator.clipboard.writeText(text).then(done, () => prompt('Copy this:', text)); } catch (e) { prompt('Copy this:', text); }
  }

  async function act(fn, el) {
    if (S.busy) return;
    S.busy = true; el.classList.add('ct-busy');
    try { await fn(); } catch (e) { say(el, why(e), true); }
    finally { S.busy = false; el.classList.remove('ct-busy'); }
  }
  async function afterSignIn(el) {
    if (S.invite) { try { await CT.authed('/group/join', { code: S.invite.code }); } catch (e) {} S.invite = null; }
    await refreshGroups(); S.boards = {}; render();
    const n = Object.keys(json('ct.score.pending') || {}).length;
    say(sideEl(), n ? 'Your score is on the board.' : 'Welcome aboard. Your progress now follows you.');
  }
  function onSubmit(e) {
    const f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    const el = f.closest('.ct-card'), v = n => (f.elements[n].value || '').trim();
    if (f.dataset.form === 'join') act(async () => { await CT.join(v('pseudo'), f.elements.public.checked); await afterSignIn(el); }, el);
    else if (f.dataset.form === 'login') act(async () => { await CT.login(v('key')); await afterSignIn(el); }, el);
    else if (f.dataset.form === 'group') act(async () => { const g = await CT.authed('/group', { name: v('name') }); await refreshGroups(); S.scope = g.code; keepView(); S.boards = {}; render(); say(sideEl(), `${g.name} is ready: send its invite link to your friends.`); }, el);
    else if (f.dataset.form === 'joingroup') act(async () => { const g = await CT.authed('/group/join', { code: v('code') }); await refreshGroups(); S.scope = g.code; keepView(); S.boards = {}; render(); say(sideEl(), `You joined ${g.name}.`); }, el);
  }
  function onClick(e) {
    const t = e.target.closest('button, select'); if (!t) return;
    if (t.dataset.period) { S.period = t.dataset.period; keepView(); S.main.querySelectorAll('[data-period]').forEach(b => b.setAttribute('aria-selected', String(b === t))); loadBoard(); return; }
    if (t.dataset.scope !== undefined) { S.scope = t.dataset.scope; keepView(); S.main.querySelectorAll('[data-scope]').forEach(b => b.setAttribute('aria-selected', String(b === t))); loadBoard(); return; }
    if (t.dataset.act === 'newgroup') {
      const i = (S.side || S.main).querySelector('[data-form="group"] input');
      if (i) { i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus({ preventScroll: true }); }
      return;
    }
    const el = t.closest('.ct-card'); if (!el || !t.dataset.act) return;
    const a = CT.account(), code = t.dataset.code, act_ = t.dataset.act;
    if (act_ === 'copy-code') copy(a.key, el, 'code');
    else if (act_ === 'invite') copy(`${HOME}ranking/#group=${code}`, el);
    else if (act_ === 'rename') { const p = prompt('Your new pseudo:', a.pseudo); if (p && p.trim() !== a.pseudo) act(async () => { await CT.rename(p); S.boards = {}; render(); say(sideEl(), 'Renamed.'); }, el); }
    else if (act_ === 'accept') act(async () => { const g = await CT.authed('/group/join', { code: S.invite.code }); S.invite = null; await refreshGroups(); S.scope = g.code; keepView(); S.boards = {}; render(); say(sideEl(), `You joined ${g.name}.`); }, el);
    else if (act_ === 'dismiss') { S.invite = null; renderAccount(); }
    else if (act_ === 'leave') { const g = S.groups.find(x => x.code === code); if (confirm(g && g.mine ? `Close ${t.dataset.name}? Its members lose the group.` : `Leave ${t.dataset.name}?`)) act(async () => { await CT.authed('/group/leave', { code }); await refreshGroups(); S.boards = {}; render(); }, el); }
    else if (act_ === 'members') act(async () => {
      const box = el.querySelector(`[data-members="${code}"]`); if (!box) return;
      if (!box.hidden) { box.hidden = true; return; }
      const r = await CT.authed('/group/members', { code });
      box.innerHTML = r.members.map(m => `<span class="ct-member">${esc(m.pseudo)}${m.pseudo === a.pseudo ? '' : ` <button type="button" class="ct-link danger" data-act="kick" data-code="${esc(code)}" data-pseudo="${esc(m.pseudo)}">remove</button>`}</span>`).join('');
      box.hidden = false;
    }, el);
    else if (act_ === 'kick') { if (confirm(`Remove ${t.dataset.pseudo} from the group?`)) act(async () => { await CT.authed('/group/kick', { code, pseudo: t.dataset.pseudo }); await refreshGroups(); S.boards = {}; render(); }, el); }
    else if (act_ === 'logout') { if (confirm('Sign out on this device? Your progress stays here, and your pseudo and code still work.')) { CT.logout(); S.groups = []; S.boards = {}; render(); } }
    else if (act_ === 'delete') { if (confirm('Delete your pseudo, your scores and your groups from the server? Your progress on this device stays. This cannot be undone.')) act(async () => { await CT.remove(); S.groups = []; S.boards = {}; render(); say(sideEl(), 'Deleted.'); }, el); }
  }
  function onChange(e) {
    const c = e.target.closest('input[data-act="public"]');
    if (c) { const el = c.closest('.ct-card'); act(async () => { await CT.setPublic(c.checked); S.boards = {}; renderAccount(); loadBoard(); say(sideEl(), c.checked ? 'You are on the public ranking.' : 'You are off the public ranking; your groups still see you.'); }, el); }
  }
  const keepView = () => save('ct.rank.view', { period: S.period, scope: S.scope });

  let wired = false;
  function wire(el) { el.addEventListener('submit', onSubmit); el.addEventListener('click', onClick); el.addEventListener('change', onChange); }

  async function rankUI(o) {
    S.main = o.main; S.side = o.side || null; S.day = o.day;
    if (!wired) { wire(S.main); if (S.side) wire(S.side); wired = true; }
    const code = inviteFromHash();
    if (code && !(S.invite && S.invite.code === code)) {
      S.invite = { code, name: 'a group', n: 0 };
      CT.api('/group/' + code).then(g => { S.invite = { code: g.code, name: g.name, n: g.n }; renderAccount(); }, () => { S.invite = null; renderAccount(); });
    }
    if (S.groups === null) { render(); await refreshGroups(); }
    render();
  }
  addEventListener('ct-sync', () => { if (S.main) S.boards = {}; });
  // the header's account button: "Join", or the pseudo once there is one
  function acctButtons() {
    const a = CT.account();
    document.querySelectorAll('[data-acct]').forEach(el => { el.textContent = a ? a.pseudo : 'Join'; el.classList.toggle('in', !!a); });
  }
  addEventListener('storage', e => { if (e.key === 'ct.account') acctButtons(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', acctButtons); else acctButtons();
  window.CT.acctButtons = acctButtons;
  window.CT.rankUI = rankUI;
  window.CT.miniBoard = miniBoard;
  window.CT.ordinal = ordinal;
})();
</script>
<script>
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const today = (d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`)(new Date());
if (window.CT && CT.rankUI) CT.rankUI({ main: $('#rank-main'), side: $('#rank-side'), day: today });
else $('#rank-main').innerHTML = '<p class="ct-empty">The ranking is not available here.</p>';
const net = () => { $('#netchip').hidden = navigator.onLine; };
addEventListener('online', net); addEventListener('offline', net); net();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
